name: Build JDWP Injector APK

# Drop this at .github/workflows/build-apk.yml in your fork of
# wuyr/jdwp-injector-for-android (the repo has no CI of its own).
# It builds the debug APK and uploads it as an artifact you can install.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jdwp-injector-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
